version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: marketmind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketmind_user
      POSTGRES_PASSWORD: marketmind_password
      POSTGRES_DB: marketmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketmind_user -d marketmind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketmind_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://marketmind_user:marketmind_password@postgres:5432/marketmind_db
      - ENVIRONMENT=production
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models/artifacts:/app/models/artifacts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketmind_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
